name: CI

on:
  push:
    branches: [master, "feature/*"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover hosts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Generate build matrix from flake
        id: matrix
        run: |
          MATRIX=$(nix eval --json .#nixosConfigurations \
            --apply '
              configs:
                let
                  hosts = builtins.attrNames configs;
                  exclude = [ "m1n1x" ];  # Asahi firmware not available in CI
                  buildable = builtins.filter (h: !(builtins.elem h exclude)) hosts;
                  mkEntry = h: {
                    host = h;
                    system = configs.${h}.pkgs.stdenv.hostPlatform.system;
                  };
                in
                  builtins.map mkEntry buildable
            ')
          echo "matrix={\"include\":${MATRIX}}" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.host }}
    needs: discover
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Cache nix store
        uses: DeterminateSystems/flakehub-cache-action@v1

      - name: Build ${{ matrix.host }}
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --print-build-logs